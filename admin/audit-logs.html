<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs – Arunachaleshwara Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <main class="admin-main">
      <header class="admin-header" id="adminHeader"></header>
      <div class="admin-content">
        <ul class="nav nav-tabs mb-4">
          <li class="nav-item"><button class="nav-link active fw-bold text-dark" data-bs-toggle="tab" data-bs-target="#activityTab">Admin & Sub-Admin Actions</button></li>
          <li class="nav-item"><button class="nav-link fw-bold text-dark" data-bs-toggle="tab" data-bs-target="#loginTab">Authentication & Login History</button></li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="activityTab">
            <div class="admin-card">
              <div class="admin-card-header">
                <h6 class="admin-card-title"><i class="bi bi-journal-text text-warning"></i> System Activity Audit Trail</h6>
              </div>
              <div class="table-responsive">
                <table class="table admin-table">
                  <thead><tr><th>Timestamp</th><th>User & Role</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead>
                  <tbody id="auditBody"><tr><td colspan="5" class="text-center py-4 text-muted">Loading audit logs...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="tab-pane fade" id="loginTab">
            <div class="admin-card">
              <div class="admin-card-header">
                <h6 class="admin-card-title"><i class="bi bi-shield-check text-success"></i> Login Attempt History</h6>
              </div>
              <div class="table-responsive">
                <table class="table admin-table">
                  <thead><tr><th>Timestamp</th><th>Email / Sub-Admin ID</th><th>Status</th><th>Details</th></tr></thead>
                  <tbody id="loginLogsBody"><tr><td colspan="4" class="text-center py-4 text-muted">Loading login history...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin-auth.js"></script>
  <script src="assets/js/admin-core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAdminAuth();
      if (!user) return;
      if (!user.isMainAdmin) { alert('Main Admin access required.'); window.location.href = 'dashboard.html'; return; }
      renderAdminSidebar('audit-logs');
      renderAdminHeader('Audit Logs & Security', 'Tamper-Resistant Activity Trail');
      loadAudit();
    });

    async function loadAudit() {
      const sb = window.adminSupabase;
      const [{ data: acts }, { data: logins }] = await Promise.all([
        sb.from('admin_activity_logs').select('*').order('created_at', { ascending: false }).limit(100),
        sb.from('user_login_history').select('*').order('created_at', { ascending: false }).limit(100)
      ]);

      document.getElementById('auditBody').innerHTML = (!acts || acts.length === 0)
        ? '<tr><td colspan="5" class="text-center py-4 text-muted">No administrative actions recorded yet.</td></tr>'
        : acts.map(a => `
        <tr>
          <td class="small text-muted">${new Date(a.created_at).toLocaleString('en-IN')}</td>
          <td><div class="fw-bold small">${a.user_email || 'System'}</div><span class="badge bg-light text-dark border">${a.user_role || ''}</span></td>
          <td><span class="badge bg-dark">${a.action}</span></td>
          <td class="small">${a.entity_type || ''} ${a.entity_id ? `(${a.entity_id})` : ''}</td>
          <td class="small text-muted"><code>${JSON.stringify(a.metadata || {})}</code></td>
        </tr>
      `).join('');

      document.getElementById('loginLogsBody').innerHTML = (!logins || logins.length === 0)
        ? '<tr><td colspan="4" class="text-center py-4 text-muted">No login attempts recorded yet.</td></tr>'
        : logins.map(l => `
        <tr>
          <td class="small text-muted">${new Date(l.created_at).toLocaleString('en-IN')}</td>
          <td class="fw-bold small">${l.email_or_id}</td>
          <td>${getStatusBadge(l.status === 'Success' ? 'Confirmed' : 'Cancelled')} <span class="small ms-1">${l.status}</span></td>
          <td class="small text-muted">${l.failure_reason || 'Authenticated via Supabase Auth'}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
