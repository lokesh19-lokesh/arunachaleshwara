<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Arunachaleshwara Tours & Travels</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
  <style>
    body.login-page {
      min-height: 100vh;
      background: linear-gradient(135deg, #FFD84D 0%, #FFC908 55%, #E6B200 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: 'Inter', sans-serif;
    }
    .login-card {
      background: #FFFFFF;
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(69, 18, 14, 0.25);
      overflow: hidden;
      border: 2px solid rgba(69, 18, 14, 0.15);
    }
    .login-header {
      background: #FFC908;
      padding: 2rem 1.75rem 1.5rem;
      text-align: center;
      border-bottom: 2px solid rgba(69, 18, 14, 0.14);
    }
    .login-header img {
      height: 58px;
      margin-bottom: 0.75rem;
    }
    .login-header h4 {
      font-family: 'Cinzel', serif;
      color: #45120E;
      font-weight: 700;
      margin-bottom: 0.25rem;
      font-size: 1.25rem;
    }
    .login-header p {
      color: #681D17;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 0;
    }
    .login-body {
      padding: 2rem 1.75rem;
    }
    .nav-pills .nav-link {
      color: #45120E;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
    }
    .nav-pills .nav-link.active {
      background: #FFC908;
      color: #45120E;
      border-color: #D4A000;
      font-weight: 700;
    }
    .form-control:focus {
      border-color: #FFC908;
      box-shadow: 0 0 0 0.25rem rgba(255, 201, 8, 0.25);
    }
  </style>
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <img src="../assets/images/logo/logo.png" alt="Arunachaleshwara Logo">
      <h4>ARUNACHALESHWARA</h4>
      <p>Management & Booking Portal</p>
    </div>

    <div class="login-body">
      <ul class="nav nav-pills nav-fill gap-2 mb-4" id="loginTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="main-tab" data-bs-toggle="pill" data-bs-target="#main-pane" type="button" role="tab">
            <i class="bi bi-shield-lock-fill me-1"></i> Main Admin
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="sub-tab" data-bs-toggle="pill" data-bs-target="#sub-pane" type="button" role="tab">
            <i class="bi bi-person-badge-fill me-1"></i> Sub-Admin ID
          </button>
        </li>
      </ul>

      <div id="loginErrorAlert" class="alert alert-danger d-none py-2 small" role="alert"></div>

      <div class="tab-content">
        <!-- Main Admin Pane -->
        <div class="tab-pane fade show active" id="main-pane" role="tabpanel">
          <form id="mainAdminForm">
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Admin Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope-fill text-muted"></i></span>
                <input type="email" id="mainEmail" class="form-control" placeholder="Enter admin email" required autocomplete="email">
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-bold text-secondary">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key-fill text-muted"></i></span>
                <input type="password" id="mainPassword" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
              </div>
            </div>
            <button type="submit" class="btn btn-admin-yellow w-100 py-2 fs-6" id="mainLoginBtn">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Admin Panel
            </button>
          </form>
        </div>

        <!-- Sub-Admin Pane -->
        <div class="tab-pane fade" id="sub-pane" role="tabpanel">
          <form id="subAdminForm">
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Unique Sub-Admin ID</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person-badge text-muted"></i></span>
                <input type="text" id="subadminId" class="form-control text-uppercase" placeholder="Enter your Sub-Admin ID" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-bold text-secondary">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key-fill text-muted"></i></span>
                <input type="password" id="subPassword" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
              </div>
            </div>
            <button type="submit" class="btn btn-admin-primary w-100 py-2 fs-6" id="subLoginBtn">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sub-Admin Sign In
            </button>
          </form>
        </div>
      </div>

      <div class="text-center mt-4 pt-3 border-top">
        <a href="../index.html" class="text-decoration-none small text-muted">
          <i class="bi bi-arrow-left me-1"></i> Return to Public Website
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin-auth.js"></script>
  <script>
    // Redirect if already authenticated
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.adminSupabase) {
        const { data: { session } } = await window.adminSupabase.auth.getSession();
        if (session && session.user) {
          window.location.href = 'dashboard.html';
        }
      }
    });

    const errorAlert = document.getElementById('loginErrorAlert');
    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.classList.remove('d-none');
    }
    function clearError() {
      errorAlert.classList.add('d-none');
    }

    // Main Admin Login Submit
    document.getElementById('mainAdminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const btn = document.getElementById('mainLoginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying Credentials...';

      try {
        const email = document.getElementById('mainEmail').value;
        const pass = document.getElementById('mainPassword').value;
        await loginMainAdmin(email, pass);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message || 'Authentication failed. Check your credentials.');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Admin Panel';
      }
    });

    // Sub-Admin Login Submit
    document.getElementById('subAdminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const btn = document.getElementById('subLoginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Resolving Sub-Admin ID...';

      try {
        const subId = document.getElementById('subadminId').value;
        const pass = document.getElementById('subPassword').value;
        await loginSubAdmin(subId, pass);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message || 'Sub-Admin sign-in failed.');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sub-Admin Sign In';
      }
    });
  </script>
</body>
</html>
