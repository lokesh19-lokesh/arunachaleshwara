<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices & PDFs – Arunachaleshwara Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <main class="admin-main">
      <header class="admin-header" id="adminHeader"></header>
      <div class="admin-content">
        <div class="admin-card">
          <div class="admin-card-header">
            <h6 class="admin-card-title"><i class="bi bi-file-earmark-pdf-fill text-danger"></i> Issued Sequential Invoices</h6>
            <a href="bookings.html" class="btn btn-sm btn-admin-yellow"><i class="bi bi-plus-lg"></i> Issue from Bookings</a>
          </div>
          <div class="table-responsive">
            <table class="table admin-table">
              <thead>
                <tr>
                  <th>Invoice Number</th>
                  <th>Booking ID</th>
                  <th>Customer</th>
                  <th>Total / Paid</th>
                  <th>Balance</th>
                  <th>Issued Date</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="invoicesBody"><tr><td colspan="7" class="text-center py-4 text-muted">Loading invoices...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="assets/js/admin-auth.js"></script>
  <script src="assets/js/admin-core.js"></script>
  <script src="assets/js/admin-invoice-pdf.js"></script>
  <script>
    let invoicesList = [];
    let orgInvoiceSettings = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAdminAuth();
      if (!user) return;
      if (!canAccessModule('invoices')) { alert('Permission denied.'); window.location.href = 'dashboard.html'; return; }
      renderAdminSidebar('invoices');
      renderAdminHeader('Invoices & Receipts', 'Branded PDF & WhatsApp Delivery');
      await loadInvoices();
    });

    async function loadInvoices() {
      const sb = window.adminSupabase;
      const [{ data: invs }, { data: sett }] = await Promise.all([
        sb.from('invoices').select('*').order('created_at', { ascending: false }),
        sb.from('website_settings').select('value').eq('key', 'invoice_settings').maybeSingle()
      ]);
      invoicesList = invs || [];
      orgInvoiceSettings = sett ? sett.value : null;

      const tbody = document.getElementById('invoicesBody');
      if (invoicesList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No invoices generated yet. Open any booking in Bookings Management to issue an invoice.</td></tr>';
        return;
      }

      tbody.innerHTML = invoicesList.map(inv => `
        <tr>
          <td class="fw-bold text-maroon">${inv.invoice_number}</td>
          <td><a href="bookings.html?id=${inv.booking_code}" class="text-decoration-none fw-semibold">${inv.booking_code}</a></td>
          <td>
            <div class="fw-semibold">${inv.customer_name}</div>
            <small class="text-muted">${inv.customer_mobile}</small>
          </td>
          <td>
            <div class="fw-bold">${formatINR(inv.total_amount)}</div>
            <small class="text-success">Paid: ${formatINR(inv.amount_received)}</small>
          </td>
          <td class="fw-bold ${Number(inv.balance_due) > 0 ? 'text-danger' : 'text-muted'}">${formatINR(inv.balance_due)}</td>
          <td class="small">${formatDate(inv.invoice_date)}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-admin-yellow me-1" onclick="downloadInv('${inv.id}')">
              <i class="bi bi-file-earmark-pdf-fill"></i> PDF
            </button>
            <button class="btn btn-sm btn-admin-whatsapp" onclick="shareInvWA('${inv.id}')">
              <i class="bi bi-whatsapp"></i> Share
            </button>
          </td>
        </tr>
      `).join('');
    }

    function downloadInv(id) {
      const inv = invoicesList.find(x => x.id === id);
      if (inv) generateInvoicePDF(inv, orgInvoiceSettings);
    }

    async function shareInvWA(id) {
      const inv = invoicesList.find(x => x.id === id);
      if (!inv) return;
      const msg = `Dear ${inv.customer_name},\nThank you for choosing Arunachaleshwara Tours & Travels.\n\n*Booking ID:* ${inv.booking_code}\n*Invoice Number:* ${inv.invoice_number}\n*Total Amount:* ${formatINR(inv.total_amount)}\n*Amount Paid:* ${formatINR(inv.amount_received)}\n*Balance Due:* ${formatINR(inv.balance_due)}\n\nPlease find your official booking receipt attached. Om Namah Shivaya!`;
      await openWhatsAppShare(inv.customer_mobile, msg, inv.booking_code, 'Invoice Delivery');
    }
  </script>
</body>
</html>
