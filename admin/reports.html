<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://zifacvpvdrsylgijtfti.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Reports & Revenue – Arunachaleshwara Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <main class="admin-main">
      <header class="admin-header" id="adminHeader"></header>
      <div class="admin-content">
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="admin-stat-card green">
              <div class="admin-stat-info">
                <h6>Total Verified Collections</h6>
                <div class="admin-stat-number" id="repVerified">₹0</div>
                <div class="admin-stat-sub">Confirmed manual transactions only</div>
              </div>
              <div class="admin-stat-icon"><i class="bi bi-bank2"></i></div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="admin-stat-card warning">
              <div class="admin-stat-info">
                <h6>Pending Verification</h6>
                <div class="admin-stat-number" id="repPending">₹0</div>
                <div class="admin-stat-sub">Awaiting admin confirmation</div>
              </div>
              <div class="admin-stat-icon"><i class="bi bi-hourglass"></i></div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="admin-stat-card maroon">
              <div class="admin-stat-info">
                <h6>Confirmed Bookings Count</h6>
                <div class="admin-stat-number" id="repConfirmedCount">0</div>
                <div class="admin-stat-sub">Active & completed stays</div>
              </div>
              <div class="admin-stat-icon"><i class="bi bi-check-all"></i></div>
            </div>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card-header">
            <h6 class="admin-card-title"><i class="bi bi-file-earmark-spreadsheet-fill text-success"></i> Verified Payment & Revenue Export</h6>
            <button class="btn btn-sm btn-admin-yellow" onclick="exportCSV()">
              <i class="bi bi-download me-1"></i> Export CSV Report
            </button>
          </div>
          <div class="table-responsive">
            <table class="table admin-table">
              <thead><tr><th>TXN ID</th><th>Date</th><th>Booking</th><th>Customer</th><th>Method</th><th>UTR / Ref</th><th>Verified Amount</th></tr></thead>
              <tbody id="reportsBody"><tr><td colspan="7" class="text-center py-4 text-muted">Loading report data...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin-auth.js"></script>
  <script src="assets/js/admin-core.js"></script>
  <script>
    let verifiedRows = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAdminAuth();
      if (!user) return;
      renderAdminSidebar('reports');
      renderAdminHeader('Reports & Analytics', 'Verified Financial Ledger');
      loadReport();
    });

    async function loadReport() {
      const sb = window.adminSupabase;
      const [{ data: txns }, { data: bookings }] = await Promise.all([
        sb.from('payment_transactions').select('*').order('created_at', { ascending: false }),
        sb.from('accommodation_bookings').select('booking_status')
      ]);

      const allTxns = txns || [];
      verifiedRows = allTxns.filter(t => t.status === 'Verified');
      const totalVerified = verifiedRows.reduce((s, t) => s + Number(t.amount || 0), 0);
      const totalPending = allTxns.filter(t => t.status === 'Pending Verification').reduce((s, t) => s + Number(t.amount || 0), 0);
      const confirmedCount = (bookings || []).filter(b => ['Confirmed', 'Checked In', 'Checked Out', 'Completed'].includes(b.booking_status)).length;

      document.getElementById('repVerified').textContent = formatINR(totalVerified);
      document.getElementById('repPending').textContent = formatINR(totalPending);
      document.getElementById('repConfirmedCount').textContent = confirmedCount;

      const tbody = document.getElementById('reportsBody');
      if (verifiedRows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No verified payments recorded yet. Pending enquiries are excluded from revenue.</td></tr>';
        return;
      }

      tbody.innerHTML = verifiedRows.map(t => `
        <tr>
          <td class="small fw-bold">${t.transaction_id}</td>
          <td class="small">${formatDate(t.payment_date || t.created_at)}</td>
          <td class="small fw-bold">${t.booking_code}</td>
          <td>${t.customer_name || 'Devotee'}</td>
          <td><span class="badge bg-light text-dark border">${t.payment_method}</span></td>
          <td class="small">${t.transaction_reference || '—'}</td>
          <td class="fw-bold text-success">${formatINR(t.amount)}</td>
        </tr>
      `).join('');
    }

    function exportCSV() {
      if (verifiedRows.length === 0) {
        alert('No verified transactions available to export.');
        return;
      }
      const headers = ['Transaction ID', 'Date', 'Booking ID', 'Customer', 'Method', 'Reference', 'Amount (INR)'];
      const rows = verifiedRows.map(r => [
        r.transaction_id,
        r.payment_date || r.created_at,
        r.booking_code,
        `"${(r.customer_name || '').replace(/"/g, '""')}"`,
        r.payment_method,
        `"${(r.transaction_reference || '').replace(/"/g, '""')}"`,
        r.amount
      ]);
      const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Arunachaleshwara_Verified_Revenue_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }
  </script>
</body>
</html>
