<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://zifacvpvdrsylgijtfti.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Bookings Management – Arunachaleshwara Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <main class="admin-main">
      <header class="admin-header" id="adminHeader"></header>

      <div class="admin-content">
        <!-- Filters Bar -->
        <div class="admin-card mb-4">
          <div class="admin-card-body py-3">
            <div class="row g-3 align-items-end">
              <div class="col-md-3">
                <label class="form-label small fw-bold text-muted">Search Booking / Customer</label>
                <input type="text" id="filterSearch" class="form-control form-control-sm" placeholder="Booking ID, Name, Phone...">
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-bold text-muted">Booking Status</label>
                <select id="filterStatus" class="form-select form-select-sm">
                  <option value="all">All Statuses</option>
                  <option value="Pending Request">Pending Request</option>
                  <option value="Awaiting Payment">Awaiting Payment</option>
                  <option value="Payment Verification">Payment Verification</option>
                  <option value="Confirmed">Confirmed</option>
                  <option value="Checked In">Checked In</option>
                  <option value="Checked Out">Checked Out</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-bold text-muted">Payment Status</label>
                <select id="filterPayment" class="form-select form-select-sm">
                  <option value="all">All Payment Status</option>
                  <option value="Not Paid">Not Paid</option>
                  <option value="Payment Instructions Sent">Instructions Sent</option>
                  <option value="Verification Pending">Verification Pending</option>
                  <option value="Partially Paid">Partially Paid</option>
                  <option value="Fully Paid">Fully Paid</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-bold text-muted">Category</label>
                <select id="filterType" class="form-select form-select-sm" onchange="loadBookings()">
                  <option value="accommodation">Accommodation</option>
                  <option value="service">Services & Tours</option>
                </select>
              </div>
              <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-sm btn-admin-primary flex-grow-1" onclick="loadBookings()"><i class="bi bi-funnel-fill me-1"></i> Filter</button>
                <button class="btn btn-sm btn-admin-yellow" onclick="openWalkinModal()"><i class="bi bi-plus-lg"></i> Walk-in</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Bookings Data Table -->
        <div class="admin-card">
          <div class="admin-card-header">
            <h6 class="admin-card-title"><i class="bi bi-calendar-check-fill text-warning"></i> <span id="tableTitle">Accommodation Bookings</span></h6>
            <span class="badge bg-secondary" id="bookingsCountBadge">0 bookings</span>
          </div>
          <div class="table-responsive">
            <table class="table admin-table">
              <thead>
                <tr>
                  <th>Booking ID</th>
                  <th>Customer</th>
                  <th>Accommodation / Details</th>
                  <th>Dates / Guests</th>
                  <th>Financials</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="bookingsTableBody">
                <tr><td colspan="7" class="text-center py-5 text-muted">Loading bookings from Supabase...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Booking Detail & Workflow Modal -->
  <div class="modal fade" id="bookingActionModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 14px;">
        <div class="modal-header modal-header-admin">
          <h5 class="modal-title fw-bold"><i class="bi bi-calendar-event me-2 text-warning"></i>Manage Booking: <span id="modalBookingCode">—</span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="bookingModalBody">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Manual Walk-in Booking Modal -->
  <div class="modal fade" id="newBookingModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header modal-header-admin">
          <h5 class="modal-title fw-bold" id="walkinModalTitle"><i class="bi bi-plus-circle me-2"></i>Create Walk-In / Phone Booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="walkinBookingForm">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label small fw-bold">Booking Type *</label>
                <select id="wBookingType" class="form-select" onchange="toggleWalkinBookingType()">
                  <option value="accommodation">Accommodation (Room Booking)</option>
                  <option value="service">Services &amp; Tours (Darshan / Taxi / Packages / Tickets)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Customer Full Name *</label>
                <input type="text" id="wName" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Mobile / WhatsApp Number *</label>
                <input type="tel" id="wMobile" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" id="wEmail" class="form-control">
              </div>

              <!-- Accommodation-specific fields -->
              <div class="col-md-6 walkin-acc-field">
                <label class="form-label small fw-bold">Room Category *</label>
                <select id="wCategory" class="form-select" onchange="toggleWalkinCustomCategory()" required></select>
              </div>
              <div class="col-12 d-none walkin-acc-field" id="wCustomCategoryBox">
                <div class="p-3 rounded-3 border bg-light">
                  <div class="row g-2 align-items-end">
                    <div class="col-md-6">
                      <label class="form-label small fw-bold mb-1">Custom Category Name *</label>
                      <input type="text" id="wCustomCatName" class="form-control form-control-sm" placeholder="e.g. AC Family Suite / Group Hall">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label small fw-bold mb-1">Rate per Night (₹) *</label>
                      <input type="number" id="wCustomCatPrice" class="form-control form-control-sm" placeholder="e.g. 2500" min="0" step="50">
                    </div>
                    <div class="col-md-2">
                      <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" id="wSaveCustomCat" checked>
                        <label class="form-check-label small" for="wSaveCustomCat">Save</label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-4 walkin-acc-field">
                <label class="form-label small fw-bold">Check-in Date *</label>
                <input type="date" id="wCheckIn" class="form-control" required>
              </div>
              <div class="col-md-4 walkin-acc-field">
                <label class="form-label small fw-bold">Check-out Date *</label>
                <input type="date" id="wCheckOut" class="form-control" required>
              </div>
              <div class="col-md-4 walkin-acc-field">
                <label class="form-label small fw-bold">Number of Guests *</label>
                <input type="number" id="wGuests" class="form-control" value="2" min="1" max="50" required>
              </div>

              <!-- Services & Tours-specific fields -->
              <div class="col-md-6 walkin-srv-field d-none">
                <label class="form-label small fw-bold">Service / Tour Package *</label>
                <select id="wServiceSelect" class="form-select" onchange="toggleWalkinCustomService()"></select>
              </div>
              <div class="col-12 d-none walkin-srv-field" id="wCustomServiceBox">
                <div class="p-3 rounded-3 border bg-light">
                  <label class="form-label small fw-bold mb-1">Custom Service / Tour Name *</label>
                  <input type="text" id="wCustomSrvName" class="form-control form-control-sm" placeholder="e.g. Special Girivalam Guided Tour / Airport Pickup">
                </div>
              </div>
              <div class="col-md-4 walkin-srv-field d-none">
                <label class="form-label small fw-bold">Travel / Service Date *</label>
                <input type="date" id="wTravelDate" class="form-control">
              </div>
              <div class="col-md-4 walkin-srv-field d-none">
                <label class="form-label small fw-bold">Passengers / Devotees *</label>
                <input type="number" id="wPassengers" class="form-control" value="2" min="1" max="100">
              </div>
              <div class="col-md-4 walkin-srv-field d-none">
                <label class="form-label small fw-bold">Estimated Amount (₹) *</label>
                <input type="number" id="wServiceAmount" class="form-control" placeholder="e.g. 3500" min="0" step="50">
              </div>
              <div class="col-md-6 walkin-srv-field d-none">
                <label class="form-label small fw-bold">Pickup Location</label>
                <input type="text" id="wPickupLocation" class="form-control" placeholder="e.g. Tiruvannamalai Temple / Bus Stand">
              </div>
              <div class="col-md-6 walkin-srv-field d-none">
                <label class="form-label small fw-bold">Vehicle Type</label>
                <select id="wVehicleType" class="form-select">
                  <option value="Not Applicable">Not Applicable / Darshan / Ticket</option>
                  <option value="Sedan (Dzire / Etios)">Sedan (Dzire / Etios)</option>
                  <option value="SUV (Ertiga / Innova)">SUV (Ertiga / Innova)</option>
                  <option value="Tempo Traveller">Tempo Traveller (12–17 Seater)</option>
                  <option value="Mini Bus / Coach">Mini Bus / Tourist Coach</option>
                  <option value="Auto Rickshaw">Auto Rickshaw</option>
                  <option value="Two-Wheeler / Bike">Two-Wheeler / Bike Rental</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Special Requirements / Notes</label>
                <textarea id="wNotes" class="form-control" rows="2"></textarea>
              </div>
            </div>
            <div class="mt-4 d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-admin-primary">Create Booking Request</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="assets/js/admin-auth.js"></script>
  <script src="assets/js/admin-core.js"></script>
  <script src="assets/js/admin-invoice-pdf.js"></script>
  <script>
    let allRooms = [];
    let allCategories = [];
    let currentBookings = [];
    let whatsappTemplates = {};

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAdminAuth();
      if (!user) return;
      if (!canAccessModule('bookings')) {
        alert('You do not have permission to access Bookings.');
        window.location.href = 'dashboard.html';
        return;
      }

      renderAdminSidebar('bookings');
      renderAdminHeader('Booking Management', 'Manual Verification Workflow');

      // Load reference data & bookings in PARALLEL for maximum speed
      await Promise.all([loadReferenceData(), loadBookings()]);

      // Auto-open specific booking if ?id= in URL
      const urlParams = new URLSearchParams(window.location.search);
      const targetCode = urlParams.get('id');
      if (targetCode) {
        const found = currentBookings.find(b => b.booking_id === targetCode);
        if (found) openBookingModal(found.id);
      }
    });

    async function loadReferenceData() {
      const sb = window.adminSupabase;
      const [{ data: rooms }, { data: cats }, { data: wa }, { data: srvs }, { data: pkgs }] = await Promise.all([
        sb.from('accommodation_rooms').select('*').order('room_number'),
        sb.from('accommodation_categories').select('*').order('order_num'),
        sb.from('whatsapp_settings').select('*').maybeSingle(),
        sb.from('services').select('id, title').order('order_num'),
        sb.from('tour_packages').select('id, title').order('order_num')
      ]);
      allRooms = rooms || [];
      allCategories = cats || [];
      whatsappTemplates = (wa && wa.templates) || {};

      const catSelect = document.getElementById('wCategory');
      catSelect.innerHTML = allCategories.map(c => `<option value="${c.id}" data-price="${c.base_price}" data-name="${c.name}">${c.name} (${formatINR(c.base_price)}/night)</option>`).join('') +
        `<option value="__custom__">+ Custom Category / Price...</option>`;
      toggleWalkinCustomCategory();

      // Populate Services & Tour Packages dropdown
      const srvOpts = (srvs || []).filter(s => s.id !== 'accommodation').map(s =>
        `<option value="srv:${s.id}" data-title="${s.title}">${s.title} (Service)</option>`
      );
      const pkgOpts = (pkgs || []).map(p =>
        `<option value="pkg:${p.id}" data-title="${p.title}">${p.title} (Tour Package)</option>`
      );
      const fallbackOpts = srvOpts.length === 0 && pkgOpts.length === 0 ? [
        `<option value="temple-darshan" data-title="Temple Darshan Services">Temple Darshan Services</option>`,
        `<option value="taxi-car-rentals" data-title="Taxi & Car Rentals">Taxi &amp; Car Rentals</option>`,
        `<option value="bus-ticket-booking" data-title="Bus Ticket Booking">Bus Ticket Booking</option>`,
        `<option value="train-ticket-booking" data-title="Train Ticket Booking">Train Ticket Booking</option>`,
        `<option value="auto-services" data-title="Auto Services">Auto Services</option>`,
        `<option value="bike-rentals" data-title="Bike Rentals">Bike Rentals</option>`,
        `<option value="sapta-shiva-yatra" data-title="1 Day Sapta Shiva Kshetra Yatra">1 Day Sapta Shiva Kshetra Yatra (Tour)</option>`
      ] : [];

      const srvSelect = document.getElementById('wServiceSelect');
      if (srvSelect) {
        srvSelect.innerHTML = [...srvOpts, ...pkgOpts, ...fallbackOpts].join('') +
          `<option value="__custom__">+ Custom Service / Tour...</option>`;
      }
    }

    function openWalkinModal() {
      const currentFilter = document.getElementById('filterType').value;
      document.getElementById('wBookingType').value = currentFilter === 'service' ? 'service' : 'accommodation';
      toggleWalkinBookingType();
      new bootstrap.Modal(document.getElementById('newBookingModal')).show();
    }

    function toggleWalkinBookingType() {
      const type = document.getElementById('wBookingType').value;
      const isAcc = type === 'accommodation';

      document.getElementById('walkinModalTitle').innerHTML = isAcc
        ? '<i class="bi bi-building-add me-2"></i>Create Walk-In / Phone Room Booking'
        : '<i class="bi bi-compass me-2"></i>Create Service / Tour Package Booking';

      document.querySelectorAll('.walkin-acc-field').forEach(el => {
        if (el.id === 'wCustomCategoryBox') return;
        el.classList.toggle('d-none', !isAcc);
      });
      document.querySelectorAll('.walkin-srv-field').forEach(el => {
        if (el.id === 'wCustomServiceBox') return;
        el.classList.toggle('d-none', isAcc);
      });

      // Toggle required attributes appropriately
      document.getElementById('wCategory').required = isAcc;
      document.getElementById('wCheckIn').required = isAcc;
      document.getElementById('wCheckOut').required = isAcc;
      document.getElementById('wGuests').required = isAcc;

      document.getElementById('wServiceSelect').required = !isAcc;
      document.getElementById('wTravelDate').required = !isAcc;
      document.getElementById('wPassengers').required = !isAcc;
      document.getElementById('wServiceAmount').required = !isAcc;

      if (isAcc) {
        document.getElementById('wCustomServiceBox').classList.add('d-none');
        document.getElementById('wCustomSrvName').required = false;
        toggleWalkinCustomCategory();
      } else {
        document.getElementById('wCustomCategoryBox').classList.add('d-none');
        document.getElementById('wCustomCatName').required = false;
        document.getElementById('wCustomCatPrice').required = false;
        toggleWalkinCustomService();
      }
    }

    function toggleWalkinCustomService() {
      const srvSel = document.getElementById('wServiceSelect');
      const box = document.getElementById('wCustomServiceBox');
      const inp = document.getElementById('wCustomSrvName');
      const isCustom = srvSel && srvSel.value === '__custom__' && document.getElementById('wBookingType').value === 'service';
      box.classList.toggle('d-none', !isCustom);
      inp.required = isCustom;
    }

    function toggleWalkinCustomCategory() {
      const catSelect = document.getElementById('wCategory');
      const box = document.getElementById('wCustomCategoryBox');
      const nameInput = document.getElementById('wCustomCatName');
      const priceInput = document.getElementById('wCustomCatPrice');
      const isCustom = catSelect.value === '__custom__' && document.getElementById('wBookingType').value === 'accommodation';
      box.classList.toggle('d-none', !isCustom);
      nameInput.required = isCustom;
      priceInput.required = isCustom;
    }

    async function loadBookings() {
      const sb = window.adminSupabase;
      const type = document.getElementById('filterType').value;
      const status = document.getElementById('filterStatus').value;
      const payStatus = document.getElementById('filterPayment').value;
      const search = document.getElementById('filterSearch').value.trim().toLowerCase();

      document.getElementById('tableTitle').textContent = type === 'accommodation' ? 'Accommodation Bookings' : 'Service & Tour Bookings';
      const table = type === 'accommodation' ? 'accommodation_bookings' : 'service_bookings';

      let query = sb.from(table).select('*').order('created_at', { ascending: false });
      if (status !== 'all') query = query.eq('booking_status', status);
      if (payStatus !== 'all') query = query.eq('payment_status', payStatus);

      const { data, error } = await query;
      if (error) {
        showAdminToast('Error fetching bookings: ' + error.message, 'error');
        return;
      }

      let rows = data || [];
      if (search) {
        rows = rows.filter(r =>
          (r.booking_id || '').toLowerCase().includes(search) ||
          (r.customer_name || '').toLowerCase().includes(search) ||
          (r.mobile || '').toLowerCase().includes(search)
        );
      }

      currentBookings = rows;
      document.getElementById('bookingsCountBadge').textContent = `${rows.length} booking(s)`;

      const tbody = document.getElementById('bookingsTableBody');
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No bookings match your current filters.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(b => {
        const roomDesc = type === 'accommodation'
          ? `<strong>${b.category_name || 'Room'}</strong><br><small class="text-muted">${b.allocated_room_number ? 'Room #' + b.allocated_room_number : 'Unallocated'}</small>`
          : `<strong>${b.service_title || 'Service'}</strong><br><small class="text-muted">${b.vehicle_type || b.pickup_location || ''}</small>`;

        const dateDesc = type === 'accommodation'
          ? `<span>${formatDate(b.check_in)} → ${formatDate(b.check_out)}</span><br><small class="text-muted">${b.nights} Night(s) • ${b.guests} Guests</small>`
          : `<span>${formatDate(b.travel_date)}</span><br><small class="text-muted">${b.passengers || 1} Pax</small>`;

        return `
          <tr>
            <td>
              <span class="fw-bold text-dark">${b.booking_id}</span>
              <div class="small text-muted">${formatDate(b.created_at)}</div>
            </td>
            <td>
              <div class="fw-semibold">${b.customer_name}</div>
              <div class="small text-muted"><i class="bi bi-telephone me-1"></i>${b.mobile}</div>
            </td>
            <td>${roomDesc}</td>
            <td>${dateDesc}</td>
            <td>
              <div class="fw-bold">${formatINR(b.estimated_amount)}</div>
              <div class="small text-success">Paid: ${formatINR(b.amount_paid)}</div>
              <div class="small text-danger">Bal: ${formatINR(b.balance_amount)}</div>
            </td>
            <td>
              <div class="mb-1">${getStatusBadge(b.booking_status)}</div>
              <div>${getStatusBadge(b.payment_status)}</div>
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-admin-primary" onclick="openBookingModal('${b.id}')">
                <i class="bi bi-sliders me-1"></i> Manage
              </button>
            </td>
          </tr>`;
      }).join('');
    }

    async function openBookingModal(bookingUuid) {
      const sb = window.adminSupabase;
      const type = document.getElementById('filterType').value;
      const b = currentBookings.find(item => item.id === bookingUuid);
      if (!b) return;

      document.getElementById('modalBookingCode').textContent = b.booking_id;

      // Load payment transactions & invoices for this booking
      const [{ data: txns }, { data: invs }] = await Promise.all([
        sb.from('payment_transactions').select('*').eq('booking_code', b.booking_id).order('created_at', { ascending: false }),
        sb.from('invoices').select('*').eq('booking_code', b.booking_id).order('created_at', { ascending: false })
      ]);

      const paymentRows = (txns || []).length === 0
        ? '<p class="text-muted small mb-0">No manual payments recorded yet.</p>'
        : `<table class="table table-sm table-bordered mt-2 mb-0">
            <thead class="table-light"><tr><th>TXN ID</th><th>Method</th><th>Ref / UTR</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>
              ${txns.map(t => `
                <tr>
                  <td class="small fw-bold">${t.transaction_id}</td>
                  <td class="small">${t.payment_method}</td>
                  <td class="small">${t.transaction_reference || '—'}</td>
                  <td class="small fw-bold text-success">${formatINR(t.amount)}</td>
                  <td>${getStatusBadge(t.status)}</td>
                  <td>
                    ${t.status === 'Pending Verification'
                      ? `<button class="btn btn-xs btn-success py-0 px-2 small" onclick="verifyPayment('${t.id}', '${b.id}', ${t.amount})">Verify</button>`
                      : '<span class="small text-muted">Done</span>'}
                  </td>
                </tr>`).join('')}
            </tbody>
           </table>`;

      const availableRoomsOptions = allRooms
        .filter(r => r.status === 'Available' || r.room_number === b.allocated_room_number)
        .map(r => `<option value="${r.id}" data-num="${r.room_number}" ${r.room_number === b.allocated_room_number ? 'selected' : ''}>Room ${r.room_number} – ${r.category_name} (${r.bed_type})</option>`)
        .join('');

      const quickRoomCatOptions = allCategories
        .map(c => `<option value="${c.id}" data-name="${c.name}" data-price="${c.base_price}" ${c.id === b.category_id ? 'selected' : ''}>${c.name}</option>`)
        .join('');

      const existingInvoice = invs && invs[0];

      document.getElementById('bookingModalBody').innerHTML = `
        <div class="row g-4">
          <!-- Left Column: Info & Workflow Steps -->

    async function sendPaymentInstructionsWA(bookingUuid) {
      const b = currentBookings.find(x => x.id === bookingUuid);
      if (!b) return;
      const type = document.getElementById('filterType').value;
      const table = type === 'accommodation' ? 'accommodation_bookings' : 'service_bookings';

      const adv = Math.round((Number(b.estimated_amount) || 0) * 0.5) || b.estimated_amount;
      const templates = await getWhatsAppTemplates();
      const tpl = templates.payment_instructions || DEFAULT_WHATSAPP_TEMPLATES.payment_instructions;
      const msg = renderWhatsAppTemplate(tpl, {
        customer_name: b.customer_name || 'Devotee',
        booking_id: b.booking_id,
        estimated_amount: formatINR(b.estimated_amount),
        advance_amount: formatINR(adv),
        upi_id: '9010515341',
        account_name: 'Arunachaleshwara Tours & Travels'
      });

      // Update status to Awaiting Payment
      await window.adminSupabase.from(table).update({
        booking_status: b.booking_status === 'Pending Request' ? 'Awaiting Payment' : b.booking_status,
        payment_status: b.payment_status === 'Not Paid' ? 'Payment Instructions Sent' : b.payment_status
      }).eq('id', b.id);

      await logAdminActivity('SEND_PAYMENT_INSTRUCTIONS', table, b.booking_id);
      await openWhatsAppShare(b.whatsapp_number || b.mobile, msg, b.booking_id, 'Payment Instructions');
      await loadBookings();
    }

    async function recordPaymentSubmit(e, bookingUuid, bookingCode, customerName) {
      e.preventDefault();
      const sb = window.adminSupabase;
      const type = document.getElementById('filterType').value;
      const amount = parseFloat(document.getElementById('payAmount').value);
      if (!amount || amount <= 0) {
        showAdminToast('Please enter a valid payment amount greater than ₹0.', 'error');
        return;
      }
      const method = document.getElementById('payMethod').value;
      const ref = document.getElementById('payRef').value.trim();
      const notes = document.getElementById('payNotes').value.trim();

      const { error } = await sb.from('payment_transactions').insert([{
        booking_id: bookingUuid,
        booking_code: bookingCode,
        booking_type: type,
        customer_name: customerName,
        amount: amount,
        payment_method: method,
        transaction_reference: ref,
        notes: notes,
        status: 'Pending Verification',
        recorded_by: window.CURRENT_ADMIN_USER.id
      }]);

      if (error) {
        showAdminToast('Error recording payment: ' + error.message, 'error');
        return;
      }

      const table = type === 'accommodation' ? 'accommodation_bookings' : 'service_bookings';
      const existingBooking = currentBookings.find(x => x.id === bookingUuid);
      const payUpdate = { payment_status: 'Verification Pending' };
      // Only move booking_status to Payment Verification if not already Confirmed or Checked In
      if (!existingBooking || ['Pending Request', 'Awaiting Payment'].includes(existingBooking.booking_status)) {
        payUpdate.booking_status = 'Payment Verification';
      }
      await sb.from(table).update(payUpdate).eq('id', bookingUuid);
      await logAdminActivity('RECORD_MANUAL_PAYMENT', 'payment_transactions', bookingCode, { amount, method, ref });

      showAdminToast('Manual payment recorded! Please click Verify after checking bank/UPI.', 'success');
      await loadBookings();
      bootstrap.Modal.getInstance(document.getElementById('bookingActionModal')).hide();
      setTimeout(() => openBookingModal(bookingUuid), 350);
    }

    async function verifyPayment(txnId, bookingUuid, amount) {
      if (!confirm(`Confirm you have independently verified receipt of ${formatINR(amount)} in bank/UPI?`)) return;

      const sb = window.adminSupabase;
      const type = document.getElementById('filterType').value;
      const table = type === 'accommodation' ? 'accommodation_bookings' : 'service_bookings';

      // Mark transaction verified
      const { error } = await sb.from('payment_transactions').update({
        status: 'Verified',
        verified_by: window.CURRENT_ADMIN_USER.id,
        verified_at: new Date().toISOString()
      }).eq('id', txnId);

      if (error) {
        showAdminToast('Verification error: ' + error.message, 'error');
        return;
      }

      // Recalculate total verified paid for this booking
      const b = currentBookings.find(x => x.id === bookingUuid);
      const { data: allTxns } = await sb.from('payment_transactions').select('*').eq('booking_code', b.booking_id).order('created_at', { ascending: false });
      const verifiedTxns = (allTxns || []).filter(t => t.status === 'Verified');
      const totalVerified = verifiedTxns.reduce((s, t) => s + Number(t.amount), 0);
      const latestVerified = verifiedTxns[0] || null;
      const est = Number(b.estimated_amount || 0);
      const balance = Math.max(0, est - totalVerified);
      const newPayStatus = balance <= 0 ? 'Fully Paid' : 'Partially Paid';

      const bookingLedgerUpdate = {
        amount_paid: totalVerified,
        balance_amount: balance,
        payment_status: newPayStatus
      };
      // If a room was already allocated or booking was previously confirmed, keep/restore Confirmed status
      if (b.booking_status === 'Payment Verification' && (b.allocated_room_number || b.confirmed_at)) {
        bookingLedgerUpdate.booking_status = 'Confirmed';
      }
      await sb.from(table).update(bookingLedgerUpdate).eq('id', bookingUuid);

      // Sync any already-issued invoice for this booking so PDF & WhatsApp always reflect verified payments
      await sb.from('invoices').update({
        amount_received: totalVerified,
        balance_due: balance,
        payment_status: balance <= 0 ? 'Paid' : 'Partially Paid',
        payment_method: latestVerified ? latestVerified.payment_method : 'Manual Payment',
        transaction_reference: latestVerified ? latestVerified.transaction_reference : null
      }).eq('booking_code', b.booking_id);

      await logAdminActivity('VERIFY_MANUAL_PAYMENT', 'payment_transactions', txnId, { booking: b.booking_id, amount });
      showAdminToast('Payment verified and booking ledger updated!', 'success');

      await loadBookings();
      bootstrap.Modal.getInstance(document.getElementById('bookingActionModal')).hide();
      setTimeout(() => openBookingModal(bookingUuid), 350);
    }

        showAdminToast('Please select a room first to edit it.', 'error');

      document.getElementById('qrEditId').value = room.id;

      document.getElementById('qrGuests').value = room.max_guests || 2;

      document.getElementById('quickRoomSaveBtn').innerHTML = '<i class="bi bi-check-lg me-1"></i> Save Room Changes';

    function closeQuickRoomBox() {
      const box = document.getElementById('quickNewRoomBox');
      const sel = document.getElementById('confirmRoomSelect');
      if (box) box.classList.add('d-none');
      if (document.getElementById('qrEditId')) document.getElementById('qrEditId').value = '';
      if (sel && sel.value === '__new_room__') sel.value = '';
    }

    function toggleQuickNewRoomBox() {
      const sel = document.getElementById('confirmRoomSelect');
      const box = document.getElementById('quickNewRoomBox');
      const editBtn = document.getElementById('quickEditRoomBtn');
      if (!sel || !box) return;
      const isNew = sel.value === '__new_room__';
      const hasExisting = Boolean(sel.value) && !isNew;
      if (editBtn) editBtn.disabled = !hasExisting;
      if (isNew) {
        document.getElementById('qrEditId').value = '';
        document.getElementById('quickRoomBoxTitle').innerHTML = '<i class="bi bi-door-open me-1"></i>Quick Add New Physical Room';
        document.getElementById('quickRoomSaveBtn').innerHTML = '<i class="bi bi-plus-lg me-1"></i> Save &amp; Select Room';
        box.classList.remove('d-none');
      } else {
        box.classList.add('d-none');
        document.getElementById('qrEditId').value = '';
      }
    }

    async function saveQuickNewRoom() {
      const sb = window.adminSupabase;
      const editId = (document.getElementById('qrEditId')?.value || '').trim();
      const roomNum = (document.getElementById('qrNumber')?.value || '').trim();
      if (!roomNum) {
        showAdminToast('Please enter a Room Number (e.g. 202).', 'error');
        return null;
      }
      const catSel = document.getElementById('qrCategory');
      const catOpt = catSel && catSel.options[catSel.selectedIndex];
      const payload = {
        room_number: roomNum,
        category_id: catSel && catSel.value ? catSel.value : null,
        category_name: (catOpt && catOpt.dataset.name) || 'Standard',
        floor: (document.getElementById('qrFloor')?.value || '2nd Floor').trim(),
        bed_type: (document.getElementById('qrBed')?.value || '1 Double Bed').trim(),
        max_guests: parseInt(document.getElementById('qrGuests')?.value) || 2,
        base_price: parseFloat(document.getElementById('qrPrice')?.value) || 1500
      };

      if (editId) {
        const { data: updatedRoom, error } = await sb.from('accommodation_rooms').update(payload).eq('id', editId).select().single();
        if (error || !updatedRoom) {
          showAdminToast('Could not update room: ' + (error?.message || 'Error'), 'error');
          return null;
        }
        await logAdminActivity('EDIT_ROOM', 'accommodation_rooms', updatedRoom.room_number);
        const idx = allRooms.findIndex(r => r.id === editId);
        if (idx !== -1) allRooms[idx] = updatedRoom;

        const sel = document.getElementById('confirmRoomSelect');
        if (sel) {
          const opt = sel.querySelector(`option[value="${editId}"]`);
          if (opt) {
            opt.dataset.num = updatedRoom.room_number;
            opt.textContent = `Room ${updatedRoom.room_number} – ${updatedRoom.category_name} (${updatedRoom.bed_type})`;
          }
          sel.value = editId;
        }
        closeQuickRoomBox();
        showAdminToast(`Room ${updatedRoom.room_number} updated!`, 'success');
        return updatedRoom;
      }

      payload.status = 'Available';
      payload.is_active = true;
      const { data: createdRoom, error } = await sb.from('accommodation_rooms').insert([payload]).select().single();
      if (error || !createdRoom) {
        showAdminToast('Could not add room: ' + (error?.message || 'Duplicate room number?'), 'error');
        return null;
      }

      await logAdminActivity('ADD_ROOM', 'accommodation_rooms', createdRoom.room_number);
      allRooms.push(createdRoom);
      allRooms.sort((a, b) => String(a.room_number).localeCompare(String(b.room_number)));

      // Add & select the new room in the dropdown right away
      const sel = document.getElementById('confirmRoomSelect');
      if (sel) {
        const opt = document.createElement('option');
        opt.value = createdRoom.id;
        opt.dataset.num = createdRoom.room_number;
        opt.textContent = `Room ${createdRoom.room_number} – ${createdRoom.category_name} (${createdRoom.bed_type})`;
        const addNewOpt = sel.querySelector('option[value="__new_room__"]');
        sel.insertBefore(opt, addNewOpt);
        sel.value = createdRoom.id;
        toggleQuickNewRoomBox();
      }
      showAdminToast(`Room ${createdRoom.room_number} added & selected!`, 'success');
      return createdRoom;
    }

    async function confirmBookingAction(bookingUuid) {
      const sb = window.adminSupabase;
      const type = document.getElementById('filterType').value;
      const table = type === 'accommodation' ? 'accommodation_bookings' : 'service_bookings';
      const b = currentBookings.find(x => x.id === bookingUuid);

      let roomId = null;
      let roomNumber = null;

      if (type === 'accommodation') {
        const roomSelect = document.getElementById('confirmRoomSelect');
        if (roomSelect.value === '__new_room__') {
          const created = await saveQuickNewRoom();
          if (!created) return;
        }
        roomId = roomSelect.value;
        if (!roomId || roomId === '__new_room__') {
          alert('Please select a physical room from the registry before confirming.');
          return;
        }
        roomNumber = roomSelect.options[roomSelect.selectedIndex].dataset.num;

        // Check for overlapping confirmed bookings on this exact physical room
        const { data: conflicts } = await sb.from('accommodation_bookings')
          .select('booking_id, check_in, check_out')
          .eq('room_id', roomId)
          .in('booking_status', ['Confirmed', 'Checked In'])
          .neq('id', bookingUuid)
          .lt('check_in', b.check_out)
          .gt('check_out', b.check_in);

        if (conflicts && conflicts.length > 0) {
          alert(`ROOM CONFLICT! Room ${roomNumber} is already allocated to booking ${conflicts[0].booking_id} during these dates. Please choose another room.`);
          return;
        }
      }

      const updatePayload = {
        booking_status: 'Confirmed',
        confirmed_at: new Date().toISOString(),
        confirmed_by: window.CURRENT_ADMIN_USER.id
      };

      if (type === 'accommodation') {
        updatePayload.room_id = roomId;
        updatePayload.allocated_room_number = roomNumber;
      }

      const { error } = await sb.from(table).update(updatePayload).eq('id', bookingUuid);
      if (error) {
        showAdminToast('Confirmation failed: ' + error.message, 'error');
        return;
      }

      if (type === 'accommodation' && roomId) {
        await sb.from('booking_room_allocations').insert([{
          booking_id: bookingUuid,
          room_id: roomId,
          allocated_by: window.CURRENT_ADMIN_USER.id
        }]);
      }

      await logAdminActivity('CONFIRM_BOOKING', table, b.booking_id, { allocated_room: roomNumber });
      showAdminToast(`Booking ${b.booking_id} CONFIRMED!`, 'success');

      // Send WhatsApp Confirmation
      const templates = await getWhatsAppTemplates();
      const tpl = templates.booking_confirmed || DEFAULT_WHATSAPP_TEMPLATES.booking_confirmed;
      const details = roomNumber
        ? `*Allocated Room:* Room ${roomNumber} (${b.category_name || ''})\n*Check-in:* ${formatDate(b.check_in)}\n*Check-out:* ${formatDate(b.check_out)}`
        : `*Service:* ${b.service_title || ''}`;
      const msg = renderWhatsAppTemplate(tpl, {
        customer_name: b.customer_name || 'Devotee',
        booking_id: b.booking_id,
        booking_details: details,
        room_number: roomNumber ? `Room ${roomNumber}` : '',
        category_name: b.category_name || '',
        check_in: formatDate(b.check_in),
        check_out: formatDate(b.check_out),
        service_title: b.service_title || '',
        amount_paid: formatINR(b.amount_paid),
        balance_due: formatINR(b.balance_amount),
        location: 'Avulpet Bypass, Tiruvannamalai'
      });

      await openWhatsAppShare(b.whatsapp_number || b.mobile, msg, b.booking_id, 'Booking Confirmation');
      await loadBookings();
      bootstrap.Modal.getInstance(document.getElementById('bookingActionModal')).hide();
    }

    async function cancelBookingAction(bookingUuid) {
      const reason = prompt('Enter reason for cancellation:');
      if (!reason) return;
      const sb = window.adminSupabase;
      const type = document.getElementById('filterType').value;
      const table = type === 'accommodation' ? 'accommodation_bookings' : 'service_bookings';
      const b = currentBookings.find(x => x.id === bookingUuid);

      await sb.from(table).update({ booking_status: 'Cancelled', notes: (b.notes ? b.notes + ' | ' : '') + 'Cancelled: ' + reason }).eq('id', bookingUuid);
      await logAdminActivity('CANCEL_BOOKING', table, b.booking_id, { reason });

      showAdminToast('Booking marked as Cancelled.', 'warning');
      await loadBookings();
      bootstrap.Modal.getInstance(document.getElementById('bookingActionModal')).hide();
    }

    async function generateInvoiceForBooking(bookingUuid) {
      const sb = window.adminSupabase;
      const type = document.getElementById('filterType').value;
      const b = currentBookings.find(x => x.id === bookingUuid);

      // Prefer server-side Supabase Edge Function (atomic invoice + line items + audit log)
      const { data: fnData, error: fnErr } = await sb.functions.invoke('generate-invoice', {
        body: { booking_id: b.id, booking_type: type }
      });

      if (!fnErr && fnData?.success && fnData.invoice) {
        showAdminToast(`Invoice ${fnData.invoice.invoice_number} generated!`, 'success');
        bootstrap.Modal.getInstance(document.getElementById('bookingActionModal')).hide();
        setTimeout(() => openBookingModal(bookingUuid), 350);
        return;
      }

      // Graceful fallback if Edge Function is unavailable
      const { data: txns } = await sb.from('payment_transactions').select('*').eq('booking_code', b.booking_id).eq('status', 'Verified');
      const lastTxn = txns && txns[0];

      const { data: inv, error } = await sb.from('invoices').insert([{
        booking_id: b.id,
        booking_code: b.booking_id,
        booking_type: type,
        customer_name: b.customer_name,
        customer_mobile: b.mobile,
        customer_email: b.email,
        service_description: type === 'accommodation'
          ? `${b.category_name} – ${b.nights} Night(s) (${formatDate(b.check_in)} to ${formatDate(b.check_out)})`
          : `${b.service_title}`,
        check_in: b.check_in || null,
        check_out: b.check_out || null,
        room_details: b.allocated_room_number ? `Room ${b.allocated_room_number} (${b.category_name})` : (b.category_name || b.service_title),
        subtotal: b.estimated_amount || 0,
        discount: 0,
        tax_amount: 0,
        total_amount: b.estimated_amount || 0,
        amount_received: b.amount_paid || 0,
        balance_due: b.balance_amount || 0,
        payment_status: b.payment_status,
        payment_method: lastTxn ? lastTxn.payment_method : 'Manual Transfer',
        transaction_reference: lastTxn ? lastTxn.transaction_reference : 'Verified',
        created_by: window.CURRENT_ADMIN_USER.id
      }]).select().single();

      if (error) {
        showAdminToast('Invoice generation error: ' + error.message, 'error');
        return;
      }

      await logAdminActivity('GENERATE_INVOICE', 'invoices', inv.invoice_number, { booking: b.booking_id });
      showAdminToast(`Invoice ${inv.invoice_number} generated!`, 'success');
      bootstrap.Modal.getInstance(document.getElementById('bookingActionModal')).hide();
      setTimeout(() => openBookingModal(bookingUuid), 350);
    }

    async function getSyncedInvoice(invoiceId) {
      const sb = window.adminSupabase;
      const { data: inv } = await sb.from('invoices').select('*').eq('id', invoiceId).single();
      if (!inv) return null;

      // Double-check verified payments so invoice always shows latest paid amount
      const { data: vTxns } = await sb.from('payment_transactions')
        .select('*')
        .eq('booking_code', inv.booking_code)
        .eq('status', 'Verified')
        .order('created_at', { ascending: false });

      if (vTxns && vTxns.length > 0) {
        const verifiedTotal = vTxns.reduce((s, t) => s + Number(t.amount || 0), 0);
        const totalAmt = Number(inv.total_amount || 0);
        const balDue = Math.max(0, totalAmt - verifiedTotal);
        if (verifiedTotal !== Number(inv.amount_received || 0) || balDue !== Number(inv.balance_due || 0)) {
          const latest = vTxns[0];
          const updatedFields = {
            amount_received: verifiedTotal,
            balance_due: balDue,
            payment_status: balDue <= 0 ? 'Paid' : 'Partially Paid',
            payment_method: latest.payment_method || inv.payment_method,
            transaction_reference: latest.transaction_reference || inv.transaction_reference
          };
          await sb.from('invoices').update(updatedFields).eq('id', inv.id);
          Object.assign(inv, updatedFields);
        }
      }
      return inv;
    }

    async function downloadExistingInvoice(invoiceId) {
      const sb = window.adminSupabase;
      const [inv, { data: settings }] = await Promise.all([
        getSyncedInvoice(invoiceId),
        sb.from('website_settings').select('value').eq('key', 'invoice_settings').maybeSingle()
      ]);
      if (inv) {
        generateInvoicePDF(inv, settings ? settings.value : null);
      }
    }

    async function shareInvoiceViaWA(invoiceId) {
      const inv = await getSyncedInvoice(invoiceId);
      if (!inv) return;

      const templates = await getWhatsAppTemplates();
      const tpl = templates.invoice_delivery || DEFAULT_WHATSAPP_TEMPLATES.invoice_delivery;
      const msg = renderWhatsAppTemplate(tpl, {
        customer_name: inv.customer_name || 'Devotee',
        booking_id: inv.booking_code || '',
        invoice_number: inv.invoice_number,
        total_amount: formatINR(inv.total_amount),
        amount_paid: formatINR(inv.amount_received),
        balance_due: formatINR(inv.balance_due)
      });
      await openWhatsAppShare(inv.customer_mobile, msg, inv.booking_code, 'Invoice Delivery');
    }

    // Walk-in Booking Submission (Handles both Accommodation & Services/Tours)
    document.getElementById('walkinBookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sb = window.adminSupabase;
      const bookingType = document.getElementById('wBookingType').value;

      if (bookingType === 'service') {
        const srvSel = document.getElementById('wServiceSelect');
        const srvOpt = srvSel.options[srvSel.selectedIndex];
        let serviceId = srvSel.value;
        let serviceTitle = (srvOpt && srvOpt.dataset.title) || 'Travel Service';

        if (serviceId === '__custom__') {
          serviceTitle = document.getElementById('wCustomSrvName').value.trim();
          serviceId = 'custom';
          if (!serviceTitle) {
            showAdminToast('Please enter a custom service or tour name.', 'error');
            return;
          }
        }

        const estAmount = parseFloat(document.getElementById('wServiceAmount').value) || 0;
        const { data, error } = await sb.from('service_bookings').insert([{
          service_id: serviceId,
          service_title: serviceTitle,
          customer_name: document.getElementById('wName').value.trim(),
          mobile: document.getElementById('wMobile').value.trim(),
          whatsapp_number: document.getElementById('wMobile').value.trim(),
          email: document.getElementById('wEmail').value.trim() || null,
          travel_date: document.getElementById('wTravelDate').value || null,
          pickup_location: document.getElementById('wPickupLocation').value.trim() || 'Tiruvannamalai',
          passengers: parseInt(document.getElementById('wPassengers').value) || 1,
          vehicle_type: document.getElementById('wVehicleType').value,
          estimated_amount: estAmount,
          balance_amount: estAmount,
          special_requests: document.getElementById('wNotes').value.trim()
        }]).select().single();

        if (error) {
          showAdminToast('Error creating service booking: ' + error.message, 'error');
          return;
        }

        await sb.from('customers').upsert({
          full_name: data.customer_name,
          mobile: data.mobile,
          whatsapp_number: data.whatsapp_number,
          email: data.email
        }, { onConflict: 'mobile' });

        await logAdminActivity('CREATE_SERVICE_BOOKING', 'service_bookings', data.booking_id, { service: serviceTitle });
        showAdminToast(`Service Booking ${data.booking_id} created!`, 'success');
        bootstrap.Modal.getInstance(document.getElementById('newBookingModal')).hide();
        e.target.reset();
        document.getElementById('filterType').value = 'service';
        await loadBookings();
        return;
      }

      const catSelect = document.getElementById('wCategory');
      const opt = catSelect.options[catSelect.selectedIndex];
      const checkIn = document.getElementById('wCheckIn').value;
      const checkOut = document.getElementById('wCheckOut').value;
      if (new Date(checkOut) < new Date(checkIn)) {
        showAdminToast('Check-out date cannot be before Check-in date.', 'error');
        return;
      }
      const diffDays = Math.round((new Date(checkOut) - new Date(checkIn)) / 86400000);
      const nights = Math.max(1, diffDays);

      let categoryId = catSelect.value;
      let categoryName = opt.dataset.name;
      let price = parseFloat(opt.dataset.price || 1200);

      if (catSelect.value === '__custom__') {
        categoryName = document.getElementById('wCustomCatName').value.trim();
        price = parseFloat(document.getElementById('wCustomCatPrice').value) || 0;
        if (!categoryName || price <= 0) {
          showAdminToast('Please enter a valid custom category name and rate.', 'error');
          return;
        }
        categoryId = null;

        if (document.getElementById('wSaveCustomCat').checked) {
          const slug = categoryName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Date.now().toString().slice(-4);
          const { data: newCat } = await sb.from('accommodation_categories').insert([{
            slug,
            name: categoryName,
            short_desc: `${categoryName} accommodation option`,
            base_price: price,
            max_guests: parseInt(document.getElementById('wGuests').value) || 2,
            order_num: allCategories.length + 1,
            is_active: true
          }]).select().single();
          if (newCat) {
            categoryId = newCat.id;
            await loadReferenceData();
          }
        }
      }

      const total = nights * price;

      const { data, error } = await sb.from('accommodation_bookings').insert([{
        customer_name: document.getElementById('wName').value.trim(),
        mobile: document.getElementById('wMobile').value.trim(),
        whatsapp_number: document.getElementById('wMobile').value.trim(),
        email: document.getElementById('wEmail').value.trim() || null,
        category_id: categoryId,
        category_name: categoryName,
        check_in: checkIn,
        check_out: checkOut,
        nights: nights,
        guests: parseInt(document.getElementById('wGuests').value) || 2,
        estimated_amount: total,
        balance_amount: total,
        special_requirements: document.getElementById('wNotes').value.trim()
      }]).select().single();

      if (error) {
        showAdminToast('Error creating booking: ' + error.message, 'error');
        return;
      }

      // Upsert customer
      await sb.from('customers').upsert({
        full_name: data.customer_name,
        mobile: data.mobile,
        whatsapp_number: data.whatsapp_number,
        email: data.email
      }, { onConflict: 'mobile' });

      await logAdminActivity('CREATE_WALKIN_BOOKING', 'accommodation_bookings', data.booking_id);
      showAdminToast(`Booking ${data.booking_id} created!`, 'success');
      bootstrap.Modal.getInstance(document.getElementById('newBookingModal')).hide();
      e.target.reset();
      toggleWalkinCustomCategory();
      await loadBookings();
    });
  </script>
